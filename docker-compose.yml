services:
  web:
    build: .
    image: nextocode-landing:latest
    container_name: nextocode-landing
    # No published ports: GESPRO-caddy reaches it over the shared network.
    networks:
      - proxy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

networks:
  proxy:
    external: true
    name: GESPRO
